  <rect x="402" y="422" width="220" height="180" rx="24" fill="#01B3FD"/>
  <rect x="684" y="422" width="220" height="180" rx="24" fill="#02F172"/>

  <circle cx="371" cy="512" r="18" fill="#12203A"/>
  <circle cx="653" cy="512" r="18" fill="#12203A"/>
</svg>
