<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- White background: keeps the mark legible in light theme and on the Marketplace listing card -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Three blocks + two dot separators: header.payload.signature, the visual shape of a JWT -->
